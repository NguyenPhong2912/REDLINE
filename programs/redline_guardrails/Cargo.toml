[package]
name = "redline_guardrails"
version = "0.2.0"
description = "On-chain policy guardrails for REDLINE agents: vault PDA, bounded grants, gated SPL transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "redline_guardrails"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
